name: Build

# 公開せずにパイプラインと dbt build だけを回す。全系列を取ると時間がかかるので、
# PR では手で回す
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python -c "import main; main.fetch()"
      - run: uv run dbt build --profiles-dir ci
