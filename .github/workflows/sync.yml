name: Apply

on:
  push:
    branches: [main]
  # 毎日 3 時 (JST)。値は最終更新日が変わった系列だけを取る (pipelines/boj.py)
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@4aafe4fe1a8d514011ca7ef5beb0e8a0ea261888
    with:
      dataset_name: boj
      # 公開中のバージョンに表が無いときだけ全系列を取る。間を空けて取るので 2〜3 時間かかる
      timeout_minutes: 240
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
