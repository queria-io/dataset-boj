name: Apply

on:
  push:
    branches: [main]
  # 定期実行はせず、手で回す
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@84cde26eceaa8beb74cce30d82da2dcb44174043
    with:
      dataset_name: boj
      # 全 DB の全系列を取り直す。間を空けて取るので時間がかかる
      timeout_minutes: 240
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
