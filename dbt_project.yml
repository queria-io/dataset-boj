name: "boj"
version: "1.0.0"

profile: "boj"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros", "shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  boj:
    +database: boj
    +materialized: table
    # raw は取得したまま、stg は型付けと列名の付け替え。どちらも mart の SQL に展開し、テーブルは作らない
    timeseries:
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
