schema: loans_by_sector
name: observations
title: 貸出先別貸出金の値
description: |-
  日本銀行「貸出先別貸出金」の値です。1 行が 1 系列の 1 期です。系列名称や単位は同じスキーマの series に、series_code で結合して引きます。

  - 期（period）の桁は期種で違います。年・年度は YYYY（年度は 4 月から翌年 3 月）、半期は YYYYHH（01 が上期）、四半期は YYYYQQ（01〜04）、月次は YYYYMM です
  - 値の無い期の行はありません
primary_key: [series_code, period]
sources:
  - path: https://www.boj.or.jp/statistics/dl/loan/ldo/index.htm
fields:
  - name: series_code
    title: 系列コード
    annotations: { queria: { semantic: { role: dimension } } }
  - name: frequency
    title: 期種
    description: series の frequency と同じ
    annotations: { queria: { semantic: { role: dimension } } }
  - name: period
    title: 期
    description: 年・年度は YYYY（年度は 4 月から翌年 3 月）、半期は YYYYHH、四半期は YYYYQQ、月次は YYYYMM
  - name: year
    title: 年
    description: period の先頭 4 桁。年度の系列では年度
  - name: sub_period
    title: 月・四半期・半期
    description: period の下 2 桁。月次は月、四半期は 1〜4、半期は 1〜2。年・年度の系列は NULL
  - name: value
    title: 値
    description: 単位は series の unit
    annotations: { queria: { semantic: { role: measure } } }
