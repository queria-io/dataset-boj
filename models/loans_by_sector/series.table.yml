schema: loans_by_sector
name: series
title: 貸出先別貸出金の系列
description: |-
  日本銀行「貸出先別貸出金」の系列の一覧です。1 行が 1 系列です。国内銀行・信用金庫などの貸出金残高・設備資金・新規貸出額を、貸出先の業種別・企業規模別に四半期で持つ系列があります。値は同じスキーマの observations に、series_code で結合して読みます。

  - 総貸出と業種別の系列が並ぶので、総貸出と内訳を足し合わせないでください
  - 金額の単位は億円、貸出件数は件です
primary_key: [series_code]
sources:
  - path: https://www.boj.or.jp/statistics/dl/loan/ldo/index.htm
fields:
  - name: series_code
    title: 系列コード
    description: 日本銀行の系列コード。observations の series_code と同じ
  - name: name
    title: 系列名称
  - name: name_en
    title: 系列名称（英語）
  - name: unit
    title: 単位
  - name: unit_en
    title: 単位（英語）
  - name: frequency
    title: 期種
    description: MONTHLY（月次）・QUARTERLY（四半期）・ANNUAL(MAR)（年度）・SEMIANNUAL(SEP)（年度半期）など
  - name: category
    title: 分類
    description: 日本銀行の検索サイトでの分類。基準年や指数の種類が入ります
  - name: category_en
    title: 分類（英語）
  - name: layer1
    title: 階層 1
    description: 日本銀行の検索サイトでの並び順。layer1〜layer5 の順に並べると、検索サイトの表示順になります
  - name: layer2
    title: 階層 2
  - name: layer3
    title: 階層 3
  - name: layer4
    title: 階層 4
  - name: layer5
    title: 階層 5
  - name: start_period
    title: 収録開始期
    description: 期の書き方は observations の period と同じ
  - name: end_period
    title: 収録終了期
  - name: last_update
    title: 最終更新日
  - name: notes
    title: 備考
    description: 品目数やウエイトなど
  - name: notes_en
    title: 備考（英語）
