version: 2

models:
  - name: tankan_series
    description: 日本銀行「短観」の系列の一覧。1 行が 1 系列
    access: public
    columns:
      - name: series_code
        data_tests: [not_null, unique]
      - name: frequency
        data_tests: [not_null]
  - name: tankan_observations
    description: 日本銀行「短観」の値。1 行が 1 系列の 1 期
    access: public
    columns:
      - name: series_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('tankan_series')
                field: series_code
      - name: period
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
