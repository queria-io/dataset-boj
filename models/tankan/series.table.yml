schema: tankan
name: series
title: 短観（全国企業短期経済観測調査）の系列
description: |-
  日本銀行「短観」の系列の一覧です。1 行が 1 系列です。企業の業況判断 D.I.、売上高・経常利益・設備投資の年度計画、雇用・設備・価格の判断、企業の物価見通しなど系列があります。値は同じスキーマの observations に、series_code で結合して読みます。

  - 系列名は「D.I./業況/全規模/全産業/実績」のように、項目・規模・業種・実績か予測かを「/」で区切って並べています
  - 期種（frequency）は四半期（QUARTERLY）・年度（ANNUAL(MAR)）・年度半期（SEMIANNUAL(SEP)）があります
primary_key: [series_code]
sources:
  - path: https://www.boj.or.jp/statistics/tk/index.htm
fields:
  - name: series_code
    title: 系列コード
    description: 日本銀行の系列コード。observations の series_code と同じ
  - name: name
    title: 系列名称
  - name: name_en
    title: 系列名称（英語）
  - name: unit
    title: 単位
  - name: unit_en
    title: 単位（英語）
  - name: frequency
    title: 期種
    description: MONTHLY（月次）・QUARTERLY（四半期）・ANNUAL(MAR)（年度）・SEMIANNUAL(SEP)（年度半期）など
  - name: category
    title: 分類
    description: 日本銀行の検索サイトでの分類。基準年や指数の種類が入ります
  - name: category_en
    title: 分類（英語）
  - name: layer1
    title: 階層 1
    description: 日本銀行の検索サイトでの並び順。layer1〜layer5 の順に並べると、検索サイトの表示順になります
  - name: layer2
    title: 階層 2
  - name: layer3
    title: 階層 3
  - name: layer4
    title: 階層 4
  - name: layer5
    title: 階層 5
  - name: start_period
    title: 収録開始期
    description: 期の書き方は observations の period と同じ
  - name: end_period
    title: 収録終了期
  - name: last_update
    title: 最終更新日
  - name: notes
    title: 備考
    description: 品目数やウエイトなど
  - name: notes_en
    title: 備考（英語）
