version: 2

models:
  - name: databases
    description: 検索サイトの DB の一覧。1 行が 1 DB
    access: public
    columns:
      - name: db
        data_tests: [not_null, unique]
  - name: series
    description: 系列の一覧。1 行が 1 系列
    access: public
    columns:
      - name: db
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('databases')
                field: db
      - name: series_code
        data_tests: [not_null]
      - name: frequency
        data_tests: [not_null]
  - name: observations
    description: 値。1 行が 1 系列の 1 期
    access: public
    columns:
      - name: series_code
        data_tests: [not_null]
      - name: period
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
