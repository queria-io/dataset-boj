$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: DB の一覧
description: |-
  日本銀行 時系列統計データ検索サイトの DB（統計のまとまり）の一覧です。1 行が 1 DB です。series と observations の db 列と結合します。
primary_key: [db]
sources:
  - id: api_manual
    path: https://www.stat-search.boj.or.jp/info/api_manual.pdf
columns:
  - name: db
    title: DB 名
    description: CO（短観）、PR01（企業物価指数）、FF（資金循環）など
    dimension: categorical
  - name: name
    title: DB 名称
  - name: field
    title: 統計分野
    description: 金利（預金・貸出関連）、マーケット関連、物価、短観など
    dimension: categorical
  - name: series_count
    title: 系列の数
metrics:
  - {name: series_count, agg: sum, expr: series_count}
