$schema: https://tabledoc.queria.io/schemas/dataset/v1.json
name: boj
title: 日本銀行 時系列統計
description: |-
  日本銀行の時系列統計データ検索サイトの全ての統計です。金利、マーケット、決済、預金・マネー・貸出、金融機関バランスシート、資金循環、短観、物価、財政、国際収支・BIS 関連の DB を、DB の一覧（databases）・系列の一覧（series）・値（observations）の 3 つのテーブルにしています。

  このサービスは、日本銀行時系列統計データ検索サイトの API 機能を使用しています。サービスの内容は日本銀行によって保証されたものではありません。
image: cover.png
topics:
  - 日本銀行
  - 日銀
  - 短観
  - 業況判断
  - D.I.
  - 設備投資計画
  - 企業物価指数
  - 輸出物価指数
  - 輸入物価指数
  - 企業向けサービス価格指数
  - 物価
  - 貸出先別貸出金
  - 業種別貸出
  - 銀行貸出
  - 金利
  - 為替
  - マネーストック
  - マネタリーベース
  - 資金循環
  - 国際収支
language: ja

